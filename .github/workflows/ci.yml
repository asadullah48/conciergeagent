name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tooling
        run: python -m pip install --upgrade pip ruff
      - name: Ruff check
        run: ruff check conciergeagent tests
      - name: Ruff format check
        run: ruff format --check conciergeagent tests
        continue-on-error: true

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run test suite with coverage
        run: pytest tests -v --cov=conciergeagent --cov-report=term-missing --cov-report=xml
      - name: Enforce coverage floor
        run: coverage report --fail-under=90
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t conciergeagent:ci .
      - name: Start container
        run: docker run -d --name concierge -p 8005:8005 conciergeagent:ci
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8005/healthz > /dev/null; then
              echo "gateway is healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "gateway did not become healthy in time" >&2
          docker logs concierge >&2
          exit 1
      - name: Smoke test the concierge endpoint
        run: |
          curl -fsS -X POST http://localhost:8005/api/v1/concierge/interact \
            -H 'Content-Type: application/json' \
            -d '{"customer_profile":{"wealth_tier":"ULTRA_HNW"},"user_query":"Review my allocation.","intent_category":"ADVISORY"}' \
            | tee /dev/stderr | grep -q '"intent_routed":"ADVISORY"'
      - name: Verify metrics endpoint
        run: curl -fsS http://localhost:8005/metrics | grep -q concierge_interactions_total
      - name: Tear down
        if: always()
        run: docker rm -f concierge || true
