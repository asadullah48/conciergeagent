apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-conciergeagent
  labels:
    app.kubernetes.io/name: conciergeagent
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: conciergeagent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conciergeagent
      annotations:
        {{- if .Values.metrics.scrape }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .Values.metrics.path | quote }}
        prometheus.io/port: {{ .Values.service.port | quote }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: conciergeagent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: ENVIRONMENT
              value: {{ .Values.env.environment | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.logLevel | quote }}
            - name: JSON_LOGS
              value: {{ .Values.env.jsonLogs | quote }}
            - name: ALLOWED_ORIGINS
              value: {{ join "," .Values.env.allowedOrigins | quote }}
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
