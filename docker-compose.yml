version: '3.8'

services:
  conciergeagent-gateway:
    build: .
    container_name: conciergeagent-gateway
    ports:
      - "8005:8005"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always
