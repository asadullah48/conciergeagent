[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conciergeagent"
version = "1.2.0"
description = "Hyperpersonalized Customer Service & Financial Concierge Multi-Agent Platform"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Asadullah Shafique" }]
keywords = [
    "concierge-agent",
    "multi-agent",
    "personalization",
    "customer-experience",
    "wealth-advisory",
    "customer-support",
    "fastapi",
    "csat",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/asadullah48/conciergeagent"
Repository = "https://github.com/asadullah48/conciergeagent"
Portfolio = "https://asadullahshafique-devunity.vercel.app"
Issues = "https://github.com/asadullah48/conciergeagent/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[tool.setuptools.packages.find]
include = ["conciergeagent*"]

[tool.setuptools.package-data]
conciergeagent = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["ignore::UserWarning:langsmith.*"]

[tool.coverage.run]
source = ["conciergeagent"]
omit = ["*/static/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
