[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conciergeagent"
version = "1.0.0"
description = "Hyperpersonalized Customer Service & Financial Concierge Multi-Agent Platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ConciergeAI Hospitality Systems", email = "concierge@conciergeagent.ai" }]
keywords = ["concierge-agent", "personalization", "customer-experience", "wealth-advisory", "customer-support", "csat"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
